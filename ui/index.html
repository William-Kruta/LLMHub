<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Hub — llama.cpp Server Manager</title>
    <meta name="description" content="Manage your llama.cpp server instances from a single dashboard.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/styles.css">
</head>

<body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <rect x="9" y="9" width="6" height="6" />
                    <line x1="9" y1="1" x2="9" y2="4" />
                    <line x1="15" y1="1" x2="15" y2="4" />
                    <line x1="9" y1="20" x2="9" y2="23" />
                    <line x1="15" y1="20" x2="15" y2="23" />
                    <line x1="20" y1="9" x2="23" y2="9" />
                    <line x1="20" y1="14" x2="23" y2="14" />
                    <line x1="1" y1="9" x2="4" y2="9" />
                    <line x1="1" y1="14" x2="4" y2="14" />
                </svg>
            </div>
            <span class="brand-text">LLM Hub</span>
        </div>

        <div class="sidebar-nav">
            <a href="#hub" class="nav-item active" data-page="hub" id="nav-hub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" />
                    <rect x="14" y="3" width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" />
                    <rect x="3" y="14" width="7" height="7" />
                </svg>
                <span>Hub</span>
            </a>
            <a href="#configs" class="nav-item" data-page="configs" id="nav-configs">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <span>Configs</span>
            </a>
            <a href="#terminal" class="nav-item" data-page="terminal" id="nav-terminal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 17 10 11 4 5" />
                    <line x1="12" y1="19" x2="20" y2="19" />
                </svg>
                <span>Terminal</span>
            </a>
            <a href="#agents" class="nav-item" data-page="agents" id="nav-agents">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="13" x2="12" y2="15"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                </svg>
                <span>Agents</span>
            </a>
            <a href="#tasks" class="nav-item" data-page="tasks" id="nav-tasks">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
                <span>Tasks</span>
            </a>
            <a href="#chat" class="nav-item" data-page="chat" id="nav-chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>Chat</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <div class="version-badge">v0.1.0</div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <!-- Pages are rendered dynamically by app.js -->
    </main>

    <!-- Config Modal -->
    <div class="modal-overlay" id="config-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">New Configuration</h2>
                <button class="modal-close" id="modal-close" aria-label="Close modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <form id="config-form">
                <input type="hidden" id="config-id">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="config-name">Server Name</label>
                        <input type="text" id="config-name" placeholder="My LLM Server" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="config-model-path">Model Path</label>
                        <input type="text" id="config-model-path" placeholder="/path/to/model.gguf" required>
                    </div>
                    <div class="form-group">
                        <label for="config-host">Host</label>
                        <input type="text" id="config-host" value="127.0.0.1">
                    </div>
                    <div class="form-group">
                        <label for="config-port">Port</label>
                        <input type="number" id="config-port" value="8080" min="1" max="65535">
                    </div>
                    <div class="form-group">
                        <label for="config-gpu-layers">GPU Layers</label>
                        <input type="number" id="config-gpu-layers" value="-1" min="-1">
                        <span class="form-hint">-1 = all layers</span>
                    </div>
                    <div class="form-group">
                        <label for="config-ctx-size">Context Size</label>
                        <input type="number" id="config-ctx-size" value="4096" min="128">
                    </div>
                    <div class="form-group">
                        <label for="config-threads">Threads</label>
                        <input type="number" id="config-threads" value="4" min="1">
                    </div>
                    <div class="form-group">
                        <label for="config-parallel">Parallel Slots</label>
                        <input type="number" id="config-parallel" value="1" min="1">
                    </div>
                    <div class="form-group full-width">
                        <label class="checkbox-label">
                            <input type="checkbox" id="config-cont-batching" checked>
                            <span class="checkmark"></span>
                            Continuous Batching
                        </label>
                    </div>
                    <div class="form-group full-width">
                        <label for="config-mmproj-path">MMProj Path</label>
                        <input type="text" id="config-mmproj-path" placeholder="/path/to/model.mmproj">
                        <span class="form-hint">Path to a multimodal projector file (optional, for vision models)</span>
                    </div>
                    <div class="form-group full-width">
                        <label for="config-extra-args">Extra Arguments</label>
                        <input type="text" id="config-extra-args" placeholder="--jinja --temp 0.8">
                        <span class="form-hint">Additional CLI flags passed to llama-server</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="modal-save">Save Configuration</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Agent Modal -->
    <div class="modal-overlay" id="agent-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="agent-modal-title">New Agent</h2>
                <button class="modal-close" id="agent-modal-close" aria-label="Close modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <form id="agent-form">
                <input type="hidden" id="agent-id">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="agent-name">Agent Name</label>
                        <input type="text" id="agent-name" placeholder="My Research Agent" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="agent-soul-path">Soul MD Path</label>
                        <input type="text" id="agent-soul-path" placeholder="/path/to/soul.md">
                        <span class="form-hint">Optional: absolute path to a soul.md file on this machine</span>
                    </div>
                    <div class="form-group full-width">
                        <div class="tool-group">
                            <div class="tool-group-label">Web Tools</div>
                            <div class="tool-group-checks">
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="web_search"><span class="checkmark"></span>web_search</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="fetch_page"><span class="checkmark"></span>fetch_page</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="news_search"><span class="checkmark"></span>news_search</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="image_search"><span class="checkmark"></span>image_search</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="wikipedia_summary"><span class="checkmark"></span>wikipedia_summary</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="search_and_fetch"><span class="checkmark"></span>search_and_fetch</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="search_subreddit"><span class="checkmark"></span>search_subreddit</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <div class="tool-group">
                            <div class="tool-group-label">Stock Tools</div>
                            <div class="tool-group-checks">
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="get_candles"><span class="checkmark"></span>get_candles</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="get_options"><span class="checkmark"></span>get_options</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="get_income_statements"><span class="checkmark"></span>get_income_statements</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="get_balance_sheet"><span class="checkmark"></span>get_balance_sheet</label>
                                <label class="checkbox-label"><input type="checkbox" name="tool" value="get_cash_flow"><span class="checkmark"></span>get_cash_flow</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" id="agent-modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="agent-modal-save">Save Agent</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/ui/app.js"></script>
</body>

</html>
